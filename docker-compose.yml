services:

  postgres:
    image: postgres:16

    container_name: jarvis-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jarvis

    ports:
      - "5439:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jarvis"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Carries rendered emails to the standalone mail service. Host ports are
  # shifted off the AMQP defaults for the same reason Postgres sits on 5439:
  # a broker someone already runs locally must not collide with this one.
  #
  #   amqp://localhost:5682   — what the app publishes to
  #   http://localhost:15682  — management UI, guest/guest
  rabbitmq:
    image: rabbitmq:4-management

    container_name: jarvis-mq

    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

    ports:
      - "5682:5672"
      - "15682:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: jarvis-minio

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
