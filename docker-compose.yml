services:

  postgres:
    image: postgres:16

    container_name: jarvis-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jarvis

    ports:
      - "5439:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jarvis"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Carries rendered emails to the standalone mail service. Host ports are
  # shifted off the AMQP defaults for the same reason Postgres sits on 5439:
  # a broker someone already runs locally must not collide with this one.
  #
  #   amqp://localhost:5682   — what the app publishes to
  #   http://localhost:15682  — management UI, guest/guest
  rabbitmq:
    image: rabbitmq:4-management

    container_name: jarvis-mq

    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

    ports:
      - "5682:5672"
      - "15682:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 10

  # The object store for FileAsset. One bucket serves every organization; keys
  # are namespaced `organizations/<orgId>/...`, so tenancy is a prefix, not a
  # bucket per customer. Production is Cloudflare R2 — same S3 API, so only the
  # four STORAGE_* values change.
  #
  #   http://localhost:9000  - S3 API, what STORAGE_ENDPOINT points at
  #   http://localhost:9001  - console, minioadmin/minioadmin123
  minio:
    image: minio/minio:latest
    container_name: jarvis-minio

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the bucket, then exits. Without this, a fresh clone comes up with a
  # running MinIO and no bucket, and the first upload fails with NoSuchBucket —
  # a setup step nobody remembers is a setup step that gets skipped. `mb
  # --ignore-existing` makes it safe on every subsequent `docker compose up`.
  minio-init:
    image: minio/mc:latest
    container_name: jarvis-minio-init

    depends_on:
      minio:
        condition: service_healthy

    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123 &&
      mc mb --ignore-existing local/jarvis-files &&
      echo 'bucket jarvis-files ready'
      "

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
